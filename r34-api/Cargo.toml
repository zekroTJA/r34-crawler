[package]
name = "r34-api"
version = "1.0.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
